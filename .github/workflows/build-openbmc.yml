name: Build X10SRL OpenBMC Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Free disk space
      run: |
        echo "Before cleanup:"
        df -h
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        echo "After cleanup:"
        df -h

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git build-essential python3 python3-distutils \
          gawk wget diffstat unzip texinfo gcc chrpath socat cpio \
          python3-pip python3-pexpect xz-utils debianutils iputils-ping \
          python3-git python3-jinja2 libegl1-mesa libsdl1.2-dev \
          xterm python3-subunit mesa-common-dev zstd liblz4-tool

    - name: Clone OpenBMC
      run: |
        git clone --depth 1 https://github.com/openbmc/openbmc.git $HOME/openbmc

    - name: Copy X10SRL layer
      run: |
        cp -r meta-supermicro-x10srl $HOME/openbmc/

    - name: Debug layer files
      run: |
        echo "=== Checking layer structure ==="
        ls -la $HOME/openbmc/meta-supermicro-x10srl/conf/machine/
        echo "=== Content of x10srl.conf ==="
        cat $HOME/openbmc/meta-supermicro-x10srl/conf/machine/x10srl.conf
        echo "=== Finding aspeed include files ==="
        find $HOME/openbmc -name "*aspeed*.inc" -type f 2>/dev/null | head -20
        echo "=== Checking existing machine configs ==="
        find $HOME/openbmc -path "*/conf/machine/*.conf" -type f 2>/dev/null | head -10

    - name: Setup build environment
      run: |
        cd $HOME/openbmc
        export TEMPLATECONF=meta-supermicro-x10srl/conf/templates/default
        . openbmc-env
        CPU_CORES=$(nproc)
        echo "BB_NUMBER_THREADS = \"$CPU_CORES\"" >> conf/local.conf
        echo "PARALLEL_MAKE = \"-j $CPU_CORES\"" >> conf/local.conf

    - name: Build OpenBMC firmware
      run: |
        cd $HOME/openbmc
        . openbmc-env
        bitbake obmc-phosphor-image

    - name: Prepare artifacts
      run: |
        mkdir -p artifacts
        cp $HOME/openbmc/build/tmp/deploy/images/x10srl/obmc-phosphor-image-x10srl.static.mtd \
           artifacts/x10srl-openbmc-$(date +%Y%m%d-%H%M%S).mtd
        cd artifacts
        sha256sum *.mtd > SHA256SUMS.txt

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: x10srl-openbmc-firmware-${{ github.run_number }}
        path: artifacts/
        retention-days: 30
