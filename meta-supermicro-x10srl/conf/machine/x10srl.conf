# X10SRL machine configuration

KMACHINE = "aspeed"
KERNEL_DEVICETREE = "aspeed/${KMACHINE}-bmc-supermicro-x10srl.dtb"

# Aspeed u-boot 2019.04 SDK dropped ast_g4_ncsi_config.
# evb-ast2400 already enables NCSI (CONFIG_CMD_NCSI / CONFIG_PHY_NCSI).
UBOOT_MACHINE = "evb-ast2400_defconfig"
UBOOT_DEVICETREE = "ast2400-evb"

FLASH_SIZE = "32768"

# Stock 32MB layout gives kernel 4352KB (0x440000). Current FIT is ~4417KB.
# Move rofs start by 256KB so kernel is 4608KB (0x480000). DTS partitions
# must match these offsets.
FLASH_ROFS_OFFSET = "5120"

require conf/machine/include/ast2400.inc
require conf/machine/include/obmc-bsp-common.inc

MACHINE_FEATURES += "obmc-host-ipmi obmc-host-state-mgmt obmc-chassis-state-mgmt"

VIRTUAL-RUNTIME_skeleton_workbook = "${MACHINE}-config"

PREFERRED_PROVIDER_virtual/obmc-host-ipmi-hw = "phosphor-ipmi-kcs"
PREFERRED_PROVIDER_virtual/obmc-chassis-mgmt = "x86-power-control"
PREFERRED_PROVIDER_virtual/obmc-fan-mgmt = "phosphor-pid-control"
PREFERRED_PROVIDER_virtual/phosphor-led-manager-config-native = "x10srl-led-manager"

OBMC_MACHINE_FEATURES += "obmc-phosphor-fan-mgmt obmc-phosphor-event-mgmt obmc-phosphor-inventory-mgmt obmc-host-ipmi"
