# Layer configuration for Supermicro X10SRL
BBPATH =. "${LAYERDIR}:"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "supermicro-x10srl"
BBFILE_PATTERN_supermicro-x10srl = "^${LAYERDIR}/"
BBFILE_PRIORITY_supermicro-x10srl = "10"
LAYERSERIES_COMPAT_supermicro-x10srl = "langdale mickledore nanbield scarthgap"
LAYERDEPENDS_supermicro-x10srl = "core openembedded-layer networking-layer meta-aspeed"
